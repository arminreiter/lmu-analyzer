# Builds the Windows desktop app and publishes a GitHub Release (+ latest.json for the in-app updater).
# Release: `npm version patch` (bumps package.json, commits, tags vX.Y.Z) → `git push --follow-tags`
name: Release Desktop App

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LMU Analyzer ${{ github.ref_name }}
          releaseBody: Download the `.exe` installer below. Installed apps update themselves.
          # Must be published (not draft) — the updater reads /releases/latest/download/latest.json
          releaseDraft: false
